<!doctype html>
<html lang="en">

    />

  <body>
    <header>
      <div class="logo">Portfolio.</div>
      <nav>
        <a href="Index.html">Home</a>
        <a href="about.html">About</a>

    <section class="skills">
      <h2 class="section-title">My <span>Skills</span></h2>

      <div class="skills-container">

          <div class="skill-title">
            <span>HTML</span>
            <span>90%</span>
          </div>
          <div class="bar">

          </div>
        </div>

        <div class="skill">
          <div class="skill-title">
            <span>CSS</span>
            <span>85%</span>
          </div>
          <div class="bar">

          </div>
        </div>

        <div class="skill">
          <div class="skill-title">
            <span>JavaScript</span>
            <span>75%</span>
          </div>
          <div class="bar">
            <div class="progress js"></div>

        </div>

        <div class="skill">
          <div class="skill-title">
            <span>PHP</span>
            <span>70%</span>
          </div>
          <div class="bar">
            <div class="progress php"></div>
          </div>
        </div>

        <div class="skill">
          <div class="skill-title">
            <span>MySQL</span>
            <span>65%</span>
          </div>
          <div class="bar">

          </div>
